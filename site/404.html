<script>
  // Old React-site routes (/projects/<slug>, /credits) now live as case pages on the home page.
  (function () {
    var map = {
      'poetry-cloud': 'poetry-cloud',
      'music-master': 'musicmaster',
      'primer-score': 'primerscore',
      'rhythm-game-trainers': 'rhythm-doctor',
      'claude-usage-monitor': 'claude-usage-monitor',
      'tiny-voice-room': 'tiny-voice-room',
      'sync-station': 'sync-station'
    };
    var m = location.pathname.match(/^\/projects\/([^\/?#]+)/);
    location.replace('/' + (m && map[m[1]] ? '#' + map[m[1]] : ''));
  })();
</script>
